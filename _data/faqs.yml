# Questions and answers for the What to know page, in order.
# `answer` can use **markdown**. TK = still to come.
- question: "When and where is the wedding?"
  answer: "The ceremony and reception will be held Saturday, July 31, 2027, at [The Waterford Inne](https://www.thewaterfordinne.com/), located at 258 Chadbourne Road, Waterford, Maine 04088. [Find more details about event programming here](/the-wedding/)."
- question: "How should we get there and where should we stay?"
  answer: "[Find more detailed information about travel and accommodations here](/getting-there/)."
- question: "Will it be an indoor or outdoor ceremony?"
  answer: "The ceremony will be held outdoors, near the barn that serves as the reception area."
- question: "What is the plan if there is inclement weather?"
  answer: "There are limited indoor backup options for the ceremony in case of inclement weather. Guests should be prepared for an outdoor ceremony in the rain. Jenna and Tyler will keep an eye on the forecast in the days leading up to the wedding and keep you apprised."
- question: "What should I wear?"
  answer: |
    Listen, it’s a barn/farm wedding in July, in Maine. This isn’t the time to wear your black-tie evening gown or suit. But don’t dress like you’re going to work on the farm, either. We’re particularly inspired by the bright, bold colors of summer wildflowers, and would love our guests to match that summertime energy. Think garden chic—florals! Bright colors! Your best summer linens! It may get chilly when the sun goes down, so having a light sweater on hand could be helpful

    The ceremony will be held on unpaved ground, so be cognizant of that as you choose footwear. There won’t be a lot of walking on grass, but there will be some.

    We’ll update this with a dress code and color palette soon if you’re looking for inspiration, so keep checking back. Or just text us and ask when it’s updated.
- question: "What parking options are available?"
  answer: "Parking is extremely limited on site and will be reserved for the couple and their immediate family, with limited exceptions made."
- question: "Will transportation or shuttles be provided?"
  answer: "Regular shuttle transportation service will be offered between The Waterford Inne and key accommodation sites, including the Hampton Inn in Oxford."
- question: "Are children invited?"
  answer: |
    Jenna and Tyler love the idea of turning their wedding into a family vacation!

    In order to best accommodate families with children who want to take advantage of Vacationland, the couple will be arranging group childcare at a local Airbnb residence where family members will be staying.

    Children will be welcome at the welcome and goodbye events on Friday and Sunday, but will not be allowed at the ceremony or reception on Saturday.

    If you will need childcare or are curious to learn more, reach out to Jenna and Tyler directly.
- question: "What will the menu include?"
  answer: |
    A buffet-style menu will be announced closer to the wedding and will reflect what is in season locally. Expect that dishes will be crafted from produce harvested from The Waterford Inne’s on-site garden and using proteins from nearby farms.

    If you or a member of your party has any dietary restrictions, reach out to Jenna and Tyler and they will make sure that your needs are met.
- question: "Where can I RSVP?"
  answer: "Expect formal invitations to be sent with requests for online RSVP in April 2027. If your mailing address changes between now and then, please let the couple know."
