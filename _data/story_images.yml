# Photo groups used in the Our Story page text. Each group has 1-3 images and an optional caption.
# `alt` must be written by a person (TK until then). Add photos with scripts/prep-image.sh, which
# prints the src/width/height lines to paste here.
first_kiss:
  caption: "Jenna and Tyler’s first documented kiss."
  images:
    - src: first-photo-kiss.jpg
      alt: Jenna and Tyler kiss at the National Arboretum in Washington, D.C.
      width: 1200
      height: 1600

glacier:
  caption: "Jenna and Tyler’s first big trip together to Glacier National Park."
  images:
    - src: milestone-glacier.jpg
      alt: TK
      width: 1600
      height: 1199

proposal:
  caption: null
  images:
    - src: engagement-moment.jpg
      alt: Tyler gets down on one knee and presents the ring as he proposes to Jenna.
      width: 1600
      height: 1312
