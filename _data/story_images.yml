# Photo groups used in the Our Story page text. Each group has 1, 2 or 4 images and an optional caption. `narrow: true` caps a lone
# non-portrait image at the portrait width.
# `alt` must be written by a person (TK until then). Add photos with scripts/prep-image.sh, which
# prints the src/width/height lines to paste here.
first_kiss:
  caption: "Jenna and Tyler’s first documented kiss."
  images:
    - src: first-photo-kiss.jpg
      alt: Jenna and Tyler kiss at the National Arboretum in Washington, D.C.
      width: 1200
      height: 1600

ring:
  caption: "Jenna models her new ring shortly after Tyler proposed. (Charla Jasper)"
  images:
    - src: jenna-ring-model.jpg
      alt: Jenna holds up her hand with the ring while Tyler kisses her.
      width: 835
      height: 835

ring-close:
  narrow: true
  caption: "Within the sapphire is a small inclusion that sometimes refracts the sunlight."
  images:
    - src: ring-close-up.jpg
      alt: Details of the ring are visible, including the stones, prongs and band.
      width: 761
      height: 761

grandparents:
  caption: "Jenna was very close with her grandparents, Anna and Frank Nesi."
  images:
    - src: anna-and-jenna.jpg
      alt: Jenna and Anna together in 2024.
      width: 1200
      height: 1600
    - src: anna-and-frank.jpg
      alt: Anna and Frank together in 2018.
      width: 1200
      height: 1600

boundary_waters:
  caption: "The trip included pontoon rentals, kitschy selfies and attempted fishing. Jenna did not want to leave."
  images:
    - src: mn-tyler-boat.jpg
      alt: Tyler lounges with a coffee on the pontoon boat.
      width: 1200
      height: 1600
    - src: mn-gftrail-sign.jpg
      alt: Jenna and Tyler take a selfie under a sign marking the start of the Gunflint Trail.
      width: 1200
      height: 1600
    - src: mn-lake-chairs.jpg
      alt: Two empty chairs and a cooler sit next to one another on the edge of a lake.
      width: 1200
      height: 1600
    - src: mn-grumpy-jenna.jpg
      alt: Jenna stands upset in a driveway wearing her Brewers hat askew and holding a coffee.
      width: 1200
      height: 1600

proposal:
  caption: "Spoiler alert: She said yes. (Charla Jasper)"
  images:
    - src: engagement-moment.jpg
      alt: Tyler gets down on one knee and presents the ring as he proposes to Jenna.
      width: 1312
      height: 1312

proposal_pigs:
  caption: "Pigs briefly interrupted the proposal. (Charla Jasper)"
  images:
    - src: engagement-pigs-moment.jpg
      alt: Pigs jumps out of his ‘wait’ and into Tyler’s arms while he was down on one knee.
      width: 1600
      height: 1600

proposal_walking:
  caption: "Jenna and Tyler have a penchant for holding hands. (Charla Jasper)"
  images:
    - src: engagement-walking.jpg
      alt: Jenna and Tyler hold hands walking in Capitol Hill while Pigs sniffs by the sidewalk.
      width: 1067
      height: 1067

pigs_puppy:
  caption: "(Courtesy of Wolf Trap Animal Rescue)"
  images:
    - src: pigs-puppy.jpg
      alt: A weeks-old Pigs had eye-catching eyes and eyebrows.
      width: 1200
      height: 1600

pigs_grid:
  caption: "Pigs loved playing with his best friend Luna before she moved away, as well as writhing in bed, holding hands and sitting like a little human."
  images:
    - src: pigs-and-luna.jpg
      alt: Pigs plays with his best friend, Luna, in a field.
      width: 1200
      height: 1600
    - src: pig-writhe.jpg
      alt: A mess of belly and limbs as Pigs writhes, belly up.
      width: 1200
      height: 1600
    - src: pig-holding-hands.jpg
      alt: One Pig paw atop Jenna and Tyler’s clasped hands.
      width: 1200
      height: 1600
    - src: pigs-in-chair.jpg
      alt: Pigs pulls up a chair for dinner at Sea Dog Brewery.
      width: 1200
      height: 1600
