# Home page content. Edit the text between the quotes; leave the keys (left side) alone.
# "TK" = still to come: it shows as a yellow marker on the page.

lead:
  - "We know — you can’t believe that Jenna Grande and Tyler Remmel aren’t married yet."
  - "Do you believe us now?"

body: "They figured that it was about time that the couple tied the knot. TK (more of a cheeky welcome message here)"

date_line: "Saturday, July 31, 2027 in Waterford, Maine"

# The four tiles, in order. `image` is optional; without it a grey placeholder shows.
# Photos go in assets/img/ (run scripts/prep-image.sh first). `alt` must be written by a person.
tiles:
  - title: "Our story"
    url: /our-story/
    image:
      src: engagement-steps.jpg
      alt: Jenna, Tyler and Pigs sit on the steps outside Tyler’s old apartment building after getting engaged on March 30, 2025.
    text: "How we met, major milestones in our relationship, the proposal story … and the Pig of it all."
  - title: "The wedding"
    url: /the-wedding/
    image:
      src: jt-at-waterford.jpg
      alt: Jenna and Tyler paused for a selfie by the pond during their visit to The Waterford Inne in August 2026.
    text: "Everything you need to know about the weekend programming, including key locations and timing."
  - title: "Getting there"
    url: /getting-there/
    image:
      src: waterford-handout-1.jpg
      alt: An aerial view of The Waterford Inne, set in a forest with mountains visible in the distance.
    text: "Information and recommendations about booking your travel and accommodations."
  - title: "What to know"
    url: /what-to-know/
    text: "Learn more about the dress code and whether the wedding will be kid-friendly, along with other FAQs."
