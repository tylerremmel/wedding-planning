# The travel map on Getting there and The wedding (see _includes/travel-map.html).
# `label` is the short name shown next to the icon (on the right unless `side: left`, or a negative `nudge`);
# `details` is the popover text (markdown, TK = still to come). `nudge` shifts an icon sideways, in pixels.
# Icons are files in assets/icons/ (jt-<icon>.svg).
# Route lines live in _data/travel_routes.json. After moving a point a route starts at, ends at or passes
# through, rerun `ruby scripts/fetch-travel-routes.rb` to redraw them.

# "Traveling there": where guests start. Origins that share a `route` share one line. Where lines overlap, the
# route listed first is drawn on top.
origins:
  - id: pwm
    name: "Portland International Jetport (PWM)"
    label: "PWM"
    icon: plane
    lat: 43.64618
    lng: -70.31441
    route: portland
    # Nudges the icon sideways (in pixels) so it sits next to PTC's instead of on top of it.
    nudge: -20
    details: "50 miles away from Waterford, about 1.5 hours driving."
  - id: ptc
    name: "Portland Transportation Center (PTC)"
    label: "PTC"
    icon: train
    lat: 43.65399
    lng: -70.29128
    route: portland
    nudge: 20
    details: "TK"
  - id: bos
    name: "Boston Logan International Airport (BOS)"
    label: "BOS"
    icon: plane
    lat: 42.36318
    lng: -71.01364
    route: boston
    details: "160 miles away from Waterford, about 3 hours driving."

# Where every route ends.
destination: inne

# Every route is drawn through these points, in order, so it follows the page copy: I-95 North to Gray,
# then ME-26 North to Norway (and on to Waterford).
via:
  - { lat: 43.88609, lng: -70.33036 } # Gray
  - { lat: 44.21362, lng: -70.54234 } # Norway

# Routes drawn without an icon at the start: drivers from the south pass through, so the line just begins in
# Hartford. `via` points sit on the highways so the line follows I-84, I-290 through Worcester, I-495 and I-95.
# These are drawn beneath the origins' routes.
through_routes:
  - route: south
    from: { lat: 41.77102, lng: -72.68008 } # I-84, Hartford
    via:
      - { lat: 42.29594, lng: -71.74713 } # I-290, Worcester

# "Once you're there": the places in the Waterford area.
places:
  - id: inne
    name: "The Waterford Inne"
    label: "The Waterford Inne"
    icon: star
    lat: 44.21300
    lng: -70.69449
    address: "258 Chadbourne Road, Waterford, Maine 04088"
    details: |-
      **Saturday, July 31, 2027** \\
      4 p.m.: Wedding ceremony \\
      6 p.m.: Reception begins with buffet-style dinner, dancing to follow

      **Sunday, August 1, 2027** \\
      <mark class="tk">TBA</mark>: Goodbye and thank you brunch
  - id: hampton
    name: "Hampton Inn By Hilton"
    label: "Hampton Inn"
    icon: pin
    lat: 44.11699
    lng: -70.44288
    address: "151 Main St, Oxford, ME 04270"
    # Hampton Inn and Oxbow are close together: nudged apart so their icons don't overlap on phones.
    nudge: 12
    details: "Recommended lodging"
  - id: oxbow
    name: "Oxbow Beer Garden"
    label: "Oxbow Beer Garden"
    # Puts the label on the left of the icon, clear of the Hampton Inn's.
    side: left
    nudge: -12
    icon: pin
    lat: 44.13100
    lng: -70.46118
    address: "420 Main St, Oxford, ME 04270"
    details: |-
      **Friday, July 30, 2027** \\
      <mark class="tk">TBA</mark>: Welcome event; select food and drinks will be provided.
