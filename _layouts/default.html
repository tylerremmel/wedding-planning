<!DOCTYPE html>
<html lang="en"{% if page.scheme %} data-scheme="{{ page.scheme }}"{% endif %}>
{%- include head.html %}
<body id="top" class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {%- include header.html %}
  <main id="main" class="site-main">
    {%- unless page.layout == "home" or page.layout == "venues" %}
    <h1 class="visually-hidden">{{ page.title }}</h1>
    {%- endunless %}
    {{ content }}
  </main>
  {%- include footer.html %}
  <script src="{{ '/assets/js/edit-mode.js' | relative_url }}" defer></script>
  {%- if content contains "data-travel-map" %}
  <script src="{{ '/assets/lib/leaflet/leaflet.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/travel-map.js' | relative_url }}" defer></script>
  {%- endif %}
</body>
</html>
